name: Auto Update Formulas

on:
  schedule:
    # 每天 12:55 UTC 自动检查
    - cron: '55 12 * * *'
  workflow_dispatch: # 允许手动点击触发

permissions:
  contents: write

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Tap Repo
        uses: actions/checkout@v4

      # ================= 更新 neko =================
      - name: Update neko
        run: |
          echo "🔍 检查 neko 版本..."
          LATEST_VERSION=$(curl -s https://api.github.com/repos/FLT18355/neko/releases/latest | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          CURRENT_VERSION=$(grep 'version "' Formula/neko.rb | head -n 1 | awk -F'"' '{print $2}')
          
          if [ "$LATEST_VERSION" == "$CURRENT_VERSION" ]; then
            echo "✅ neko 已经是版本 $LATEST_VERSION，无需更新。"
          else
            echo "🚀 发现 neko 新版本: $LATEST_VERSION (当前: $CURRENT_VERSION)"
            PROXY="https://v4.gh-proxy.org/"
            BASE="https://github.com/FLT18355/neko/releases/download/v${LATEST_VERSION}"
            
            SHA_MAC=$(curl -sL "${PROXY}${BASE}/neko-v${LATEST_VERSION}-macos-aarch64.tar.gz" | sha256sum | awk '{print $1}')
            SHA_ARM=$(curl -sL "${PROXY}${BASE}/neko-v${LATEST_VERSION}-linux-aarch64.tar.gz" | sha256sum | awk '{print $1}')
            SHA_X86=$(curl -sL "${PROXY}${BASE}/neko-v${LATEST_VERSION}-linux-x86_64.tar.gz" | sha256sum | awk '{print $1}')
            
            sed -i "s/version \".*\"/version \"${LATEST_VERSION}\"/" Formula/neko.rb
            sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${LATEST_VERSION}/g" Formula/neko.rb
            sed -i "/macos-aarch64.tar.gz/,+1 s/sha256 \".*\"/sha256 \"${SHA_MAC}\"/" Formula/neko.rb
            sed -i "/linux-aarch64.tar.gz/,+1 s/sha256 \".*\"/sha256 \"${SHA_ARM}\"/" Formula/neko.rb
            sed -i "/linux-x86_64.tar.gz/,+1 s/sha256 \".*\"/sha256 \"${SHA_X86}\"/" Formula/neko.rb
            echo "✅ neko 更新完毕"
          fi

      # ================= 更新 omp =================
      - name: Update omp
        run: |
          echo "🔍 检查 omp 版本..."
          LATEST_VERSION=$(curl -s https://api.github.com/repos/can1357/oh-my-pi/releases/latest | grep '"tag_name":' | sed -E 's/.*"v?([^"]+)".*/\1/')
          CURRENT_VERSION=$(grep 'version "' Formula/omp.rb | head -n 1 | awk -F'"' '{print $2}')
          
          if [ "$LATEST_VERSION" == "$CURRENT_VERSION" ]; then
            echo "✅ omp 已经是版本 $LATEST_VERSION，无需更新。"
          else
            echo "🚀 发现 omp 新版本: $LATEST_VERSION (当前: $CURRENT_VERSION)"
            PROXY="https://v4.gh-proxy.org/"
            BASE="https://github.com/can1357/oh-my-pi/releases/download/v${LATEST_VERSION}"
            
            # omp 没有后缀，直接下载计算
            SHA_ARM=$(curl -sL "${PROXY}${BASE}/omp-linux-arm64" | sha256sum | awk '{print $1}')
            SHA_X64=$(curl -sL "${PROXY}${BASE}/omp-linux-x64" | sha256sum | awk '{print $1}')
            
            sed -i "s/version \".*\"/version \"${LATEST_VERSION}\"/" Formula/omp.rb
            # 替换 URL 中的版本号
            sed -i "s/v[0-9]\+\.[0-9]\+\.[0-9]\+/v${LATEST_VERSION}/g" Formula/omp.rb
            # 替换哈希值
            sed -i "/omp-linux-arm64/,+1 s/sha256 \".*\"/sha256 \"${SHA_ARM}\"/" Formula/omp.rb
            sed -i "/omp-linux-x64/,+1 s/sha256 \".*\"/sha256 \"${SHA_X64}\"/" Formula/omp.rb
            echo "✅ omp 更新完毕"
          fi

      # ================= 提交更改 =================
      - name: Commit and Push changes
        run: |
          if git diff --quiet; then
            echo "没有文件发生改变，跳过提交。"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/
          git commit -m "chore: auto-bump formulas"
          git push origin main