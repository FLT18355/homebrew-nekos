name: Bump Neko
on:
  schedule:
    - cron: '55 12 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  autobump:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Update neko
        run: |
          set -euo pipefail

          LATEST_VERSION=$(curl -sf https://api.github.com/repos/FLT18355/neko/releases/latest | jq -r '.tag_name | sub("^v"; "")')
          CURRENT_VERSION=$(grep -m1 -E '^[[:space:]]*url "' Formula/neko.rb | grep -oE 'v[0-9]+\.[0-9]+\.[0-9]+' | head -1 | sed 's/^v//')

          if [[ "${CURRENT_VERSION}" == "${LATEST_VERSION}" ]]; then
            echo "已经是版本 ${LATEST_VERSION}，无需更新。"
            exit 0
          fi

          echo "🚀 发现 neko 新版本: ${LATEST_VERSION}"
          PROXY="https://v4.gh-proxy.org/"
          BASE="https://github.com/FLT18355/neko/releases/download/v${LATEST_VERSION}"

          SHA_MAC=$(curl -sfL --retry 5 --retry-delay 2 "${PROXY}${BASE}/neko-v${LATEST_VERSION}-macos-aarch64.tar.gz" | sha256sum | awk '{print $1}')
          SHA_ARM=$(curl -sfL --retry 5 --retry-delay 2 "${PROXY}${BASE}/neko-v${LATEST_VERSION}-linux-aarch64.tar.gz" | sha256sum | awk '{print $1}')
          SHA_X86=$(curl -sfL --retry 5 --retry-delay 2 "${PROXY}${BASE}/neko-v${LATEST_VERSION}-linux-x86_64.tar.gz" | sha256sum | awk '{print $1}')

          # 只替换 URL 中的版本号；不要写 version 行（Homebrew 会从 URL 推断，显式 version 属于冗余）
          sed -i -E "s/v[0-9]+\.[0-9]+\.[0-9]+/v${LATEST_VERSION}/g" Formula/neko.rb

          # 替换 SHA
          sed -i "0,/sha256/s/sha256 \".*\"/sha256 \"${SHA_X86}\"/" Formula/neko.rb
          sed -i "/macos-aarch64.tar.gz/,+1 s/sha256 \".*\"/sha256 \"${SHA_MAC}\"/" Formula/neko.rb
          sed -i "/linux-aarch64.tar.gz/,+1 s/sha256 \".*\"/sha256 \"${SHA_ARM}\"/" Formula/neko.rb

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Formula/neko.rb
          git commit -m "chore: bump neko to v${LATEST_VERSION}"
          git push
